<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blätterbuch</title>
<style>
  :root{
    --page-bg:#f4ecd8;
    --page-border:#3a2e1f;
    --ink:#2b2118;
    --accent:#8a6d3b;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  .stage{
    position:relative;
    width:min(90vw, 600px);
    height:min(45vw, 300px);
  }
  .view{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:6px;
    opacity:0;
    pointer-events:none;
    transform:scale(0.92);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .view.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
  }
  .page{
    background: var(--page-bg);
    border: 2px solid var(--page-border);
    border-radius: 4px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.35), inset 0 0 20px rgba(0,0,0,0.05);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    position:relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 26px);
  }
  .page:hover{
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.4);
  }
  .page:active{
    transform: translateY(-1px) scale(0.98);
  }
  .single{
    width: 46%;
    aspect-ratio: 1 / 1;
  }
  .double .page{
    width: 46%;
    aspect-ratio: 1 / 1;
  }
  .double .page.left{
    border-radius: 4px 0 0 4px;
    border-right: 1px solid rgba(58,46,31,0.35);
  }
  .double .page.right{
    border-radius: 0 4px 4px 0;
    border-left: 1px solid rgba(58,46,31,0.35);
  }
  .letter{
    font-size: clamp(2rem, 6vw, 4rem);
    color: var(--ink);
    letter-spacing: 2px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .hint{
    position:absolute;
    bottom: 6px;
    left: 0; right: 0;
    text-align:center;
    font-size: 0.65rem;
    letter-spacing: 1px;
    color: var(--accent);
    opacity: 0.75;
    font-family: Arial, sans-serif;
    text-transform: uppercase;
  }
  .spine{
    position:absolute;
    top:6%; bottom:6%;
    left:50%;
    width: 10px;
    margin-left:-5px;
    background: linear-gradient(90deg, rgba(0,0,0,0.25), rgba(0,0,0,0.05), rgba(0,0,0,0.25));
    pointer-events:none;
    z-index:2;
  }
  .progress{
    position:fixed;
    bottom: 18px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .dot{
    width:8px; height:8px;
    border-radius:50%;
    background: rgba(0,0,0,0.15);
    transition: background 0.3s;
  }
  .dot.on{
    background: #d8b96a;
    box-shadow: 0 0 6px #d8b96a;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="view active" data-view="A">
    <div class="page single" data-goto="BC">
      <span class="letter">A</span>
      <span class="hint">klicken zum aufschlagen</span>
    </div>
  </div>

  <div class="view double" data-view="BC">
    <div class="spine"></div>
    <div class="page left" data-goto="A">
      <span class="letter">B</span>
      <span class="hint">zurück</span>
    </div>
    <div class="page right" data-goto="DE">
      <span class="letter">C</span>
      <span class="hint">weiter</span>
    </div>
  </div>

  <div class="view double" data-view="DE">
    <div class="spine"></div>
    <div class="page left" data-goto="BC">
      <span class="letter">D</span>
      <span class="hint">zurück</span>
    </div>
    <div class="page right" data-goto="F">
      <span class="letter">E</span>
      <span class="hint">weiter</span>
    </div>
  </div>

  <div class="view" data-view="F">
    <div class="page single" data-goto="DE">
      <span class="letter">F</span>
      <span class="hint">zurück</span>
    </div>
  </div>

</div>

<div class="progress">
  <div class="dot" data-dot="A"></div>
  <div class="dot" data-dot="BC"></div>
  <div class="dot" data-dot="DE"></div>
  <div class="dot" data-dot="F"></div>
</div>

<script>
(function(){
  var views = document.querySelectorAll('.view');
  var dots = document.querySelectorAll('.dot');

  function showView(name){
    views.forEach(function(v){
      v.classList.toggle('active', v.getAttribute('data-view') === name);
    });
    dots.forEach(function(d){
      d.classList.toggle('on', d.getAttribute('data-dot') === name);
    });
  }

  document.querySelectorAll('[data-goto]').forEach(function(el){
    el.addEventListener('click', function(){
      showView(el.getAttribute('data-goto'));
    });
  });

  showView('A');
})();
</script>

</body>
</html>
